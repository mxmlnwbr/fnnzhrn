<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fnnzhrn</title>
  <meta name="description" content="fnnzhrn – ein Freundeskreis, der sich für Finanzen, Märkte und Investieren interessiert.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111412;
      --muted: #5f6661;
      --line: #e3e6e4;
      --card: #f7f8f7;
      --accent: #0f8a4f;
      --accent-soft: rgba(15, 138, 79, 0.1);
      --grid: rgba(17, 20, 18, 0.045);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d0c;
        --fg: #ecefed;
        --muted: #949b96;
        --line: #232826;
        --card: #121614;
        --accent: #3ddc84;
        --accent-soft: rgba(61, 220, 132, 0.12);
        --grid: rgba(236, 239, 237, 0.04);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--accent-soft), transparent 70%),
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: clamp(64px, 16vh, 160px) 16px 64px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 4px 12px 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 10vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    h1 .dot { color: var(--accent); }
    .chart {
      display: block;
      width: 100%;
      height: 72px;
      margin: 40px 0 56px;
      color: var(--accent);
    }
    .chart .line {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 1.8s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
    }
    .chart .area { opacity: 0; animation: fade 0.8s ease 1.4s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .chart .line { animation: none; stroke-dashoffset: 0; }
      .chart .area { animation: none; opacity: 1; }
    }
    h2 {
      margin: 0 0 14px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.project {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    a.project:hover, a.project:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -12px var(--accent);
      outline: none;
    }
    .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .text { flex: 1; min-width: 0; }
    .text strong { display: block; font-size: 1.05rem; }
    .text span { color: var(--muted); font-size: 0.925rem; }
    .arrow {
      flex: none;
      font-size: 1.25rem;
      color: var(--muted);
      transition: transform 0.15s, color 0.15s;
    }
    a.project:hover .arrow, a.project:focus-visible .arrow {
      transform: translateX(3px);
      color: var(--accent);
    }
    footer {
      padding: 32px 16px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Freundeskreis für Finanzen</span>
    <h1>fnnzhrn<span class="dot">.</span></h1>

    <svg class="chart" viewBox="0 0 600 72" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="currentColor" stop-opacity="0.18"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="area" fill="url(#fill)" d="M0 60 L40 54 L80 58 L120 46 L160 50 L200 38 L240 44 L280 30 L320 36 L360 26 L400 32 L440 18 L480 24 L520 12 L560 16 L600 4 L600 72 L0 72 Z"/>
      <path class="line" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" d="M0 60 L40 54 L80 58 L120 46 L160 50 L200 38 L240 44 L280 30 L320 36 L360 26 L400 32 L440 18 L480 24 L520 12 L560 16 L600 4"/>
    </svg>

    <h2>Projekte</h2>
    <ul>
      <li>
        <a class="project" href="https://depot.fnnzhrn.ch">
          <span class="icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
          </span>
          <span class="text">
            <strong>Depot</strong>
            <span>Unser gemeinsamer Portfolio-Tracker</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </main>
  <footer>© fnnzhrn · Keine Anlageberatung</footer>
</body>
</html>
